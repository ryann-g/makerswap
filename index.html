<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakerSwap</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="description" content="The premier hardware exchange and bounty platform for university engineering students." />
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="MakerSwap | Hardware Exchange" />
    <meta property="og:description" content="The premier hardware exchange and bounty platform for university engineering students." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://makerswap.example.com" />
    <meta property="og:image" content="https://makerswap.example.com/og-image.jpg" />
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MakerSwap | Hardware Exchange" />
    <meta name="twitter:description" content="The premier hardware exchange and bounty platform for university engineering students." />
    <meta name="twitter:image" content="https://makerswap.example.com/og-image.jpg" />
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MakerSwap",
      "url": "https://makerswap.example.com",
      "description": "Hardware exchange and bounty platform for university engineering students.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://makerswap.example.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
